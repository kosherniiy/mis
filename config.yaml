window_title: "Miscrits"
macos:
  # Высота шапки окна в точках. 0 — fullscreen / клиент без рамки.
  titlebar_height: 0
  # Имя процесса, если заголовок окна пустой. Для fullscreen на отдельном столе
  # обычно совпадает с приложением, например "Miscrits" или "Google Chrome".
  window_owner: ""
# Эталон, под который нарезаны templates и координаты в этом файле.
# Снимок другого размера (например 1440x900 на Mac) масштабируется сюда.
reference_resolution:
  width: 1920
  height: 1080
start_phase: "search"
templates_dir: "./templates"
confidence_threshold: 0.85
debug: false

ntfy:
  enabled: true
  server: "https://ntfy.sh"
  topic: "miscrits_farm_goldmonster"
  timeout: 10.0

