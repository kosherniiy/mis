window_title: "Miscrits"
coords_dir: "./layouts"
macos:
  # Высота шапки окна в точках. 0 — fullscreen / клиент без рамки.
  titlebar_height: 0
  # Имя процесса, если заголовок окна пустой. Для fullscreen на отдельном столе
  # обычно совпадает с приложением, например "Miscrits" или "Google Chrome".
  window_owner: ""

start_phase: "search"
templates_dir: "./templates"
confidence_threshold: 0.85
debug: false

ntfy:
  enabled: true
  server: "https://ntfy.sh"
  topic: "miscrits_farm_goldmonster"
  timeout: 10.0

action_delays:
  min: 0.8
  max: 2.5

map_click_interval:
  min: 4.0
  max: 6.0

max_map_click_attempts: 20

map_achievement_close:
  misses_before_click: 5

manual_mouse_pause:
  enabled: true
  jerk_threshold_px: 80
  poll_interval: 0.04

max_template_misses: 5
max_errors_before_stop: 3
stop_on_epic_plus: true
epic_stall_wait_seconds: 120
epic_stall_attack: 3

rarity_pixel:
  tolerance: 24
  colors:
    common: "#626262"
    rare: "#264bbb"
    epic: "#15d015"
    exotic: "#f840f8"
    legendary: "#ffe300"

capture_chance_area:
  tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"

rarity_order:
  - common
  - rare
  - epic
  - exotic
  - legendary

stop_rarity:
  - epic
  - exotic
  - legendary

stop_capture_chances:
  common: [27, 30]
  rare: [17, 20]

autoCatch: false
autoCatchAll: false
autoCatchRares: false
lowLevelEncounters: false
stallAnyRarity: false

catch_button_new_check:
  duration: 1.0
  interval: 0.2

capture_check_delay:
  min: 0.8
  max: 1.4

selected_attack: 2
attack_sequence: [2]
auto_catch_moveset_attacks: [4, 4, 2]

turn_check_interval:
  min: 1.0
  max: 1.5

battle_result_pixel:
  color: "#b6c8e1"
  tolerance: 0

level_up_result_check_delay:
  min: 0.7
  max: 1.2

heal_check_pixel:
  color: "#2F3B47"
  tolerance: 20

heal_confirm_open_delay:
  min: 0.5
  max: 1.0

level_up:
  enabled: true
  level_next_hold:
    min: 0.45
    max: 0.65
  level_next_hover_delay:
    min: 0.5
    max: 0.7
  level_next_ready_delay:
    min: 4.6
    max: 5.4
  marker_click_radius:
    x: 24
    y: 18
  marker_colors:
    yellow: "#ffcc00"
    blue: "#3366ff"
    gray: "#626262"
  delays:
    experience_open: {min: 0.6, max: 1.2}
    marker_select: {min: 0.25, max: 0.6}
    level_window_open: {min: 0.7, max: 1.3}
    level_complete: {min: 0.35, max: 0.75}
    popup_close: {min: 0.35, max: 0.7}
    achievement_after_experience: {min: 0.35, max: 0.7}
    promotion_open: {min: 0.5, max: 1.0}
    return_map: {min: 0.5, max: 1.0}
